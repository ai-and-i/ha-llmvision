openapi: 3.1.0
info:
  title: LLM Vision Timeline API
  version: "1.7.0"
  description: |
    REST API for interacting with the Home Assistant LLM Vision Timeline.
tags:
  - name: reference
    x-page-title: Reference
    x-page-icon: brackets-curly

servers:
  - url: https://{ha_url}/api/llmvision/timeline
    variables:
      ha_url:
        default: homeassistant.local:8123
        description: Base Home Assistant URL

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    Event:
      type: object
      required: [uid, title, start, end, key_frame, camera_name, category, label, labels]
      properties:
        uid:
          type: string
          format: uuid
          example: f2a82dcd-f37b-459a-afdf-3a115631ed69
        title:
          type: string
          example: Delivery person seen
        start:
          type: string
          format: date-time
          example: 2025-10-24T09:04:51.433879+02:00
        end:
          type: string
          format: date-time
          example: 2025-10-24T09:05:51.433879+02:00
        description:
          type: string
          example: A delivery person approaches the front door.
        key_frame:
          type: string
          example: /media/llmvision/snapshots/37ddf64a-0.jpg
        clip:
          type: string
          nullable: true
          description: Source video saved by video_analyzer with save_clip, or null.
          example: /media/llmvision/clips/0c8f5d0e-5b1a-4d0e-9a51-1f2b3c4d5e6f.mp4
        camera_name:
          type: string
          example: camera.front_door
        category:
          type: string
          description: One of person, vehicle, animal, delivery, entity, nature, or "" when unknown.
          example: animal
        label:
          type: string
          description: The primary label, labels[0], or "".
          example: squirrel
        labels:
          type: array
          items:
            type: string
          description: Free-text lowercase tags, most important first.
          example: [squirrel, bird feeder]

    EventListResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'

    EventResponse:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/Event'

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: created

    EventCreateRequest:
      type: object
      properties:
        title:
          type: string
          default: ""
        description:
          type: string
          default: ""
        key_frame:
          type: string
          default: ""
        camera_name:
          type: string
          description: Preferred camera identifier.
          default: ""
        camera_entity:
          type: string
          description: Alias for camera_name.
        category:
          type: string
          enum: [person, vehicle, animal, delivery, entity, nature]
          description: |
            Stored as given (case-insensitive). Without it, the category of the
            first label that has one, or "". With neither category nor labels,
            both are detected from the title and description.
        labels:
          type: array
          items:
            type: string
          description: Free-text tags, most important first. Stripped, lowercased and deduplicated.
          example: [squirrel, bird feeder]
        label:
          type: string
          description: Single label, put before labels. Lowercased before persistence.
          default: ""
        start:
          oneOf:
            - type: string
              format: date-time
            - type: number
          description: ISO 8601 string or Unix timestamp in seconds. Defaults to the current time when omitted or invalid.
        end:
          oneOf:
            - type: string
              format: date-time
            - type: number
          description: ISO 8601 string or Unix timestamp in seconds. Defaults to start + 1 minute when omitted or invalid.

    EventUpdateRequest:
      type: object
      description: |
        Partial update payload. Missing fields are populated from the existing event.
      properties:
        title:
          type: string
        description:
          type: string
        key_frame:
          type: string
        camera_name:
          type: string
          description: Preferred camera identifier.
        camera_entity:
          type: string
          description: Alias for camera_name.
        category:
          type: string
          enum: [person, vehicle, animal, delivery, entity, nature]
          description: |
            As on create. When category, labels and label are all omitted, the
            event keeps its category and labels. When only category is sent, it
            keeps its labels.
        labels:
          type: array
          items:
            type: string
          description: Replaces the event's labels. As on create.
        label:
          type: string
          description: Single label, put before labels. Lowercased before persistence.
        start:
          oneOf:
            - type: string
              format: date-time
            - type: number
          description: ISO 8601 string or Unix timestamp in seconds. Defaults to the existing event start when omitted.
        end:
          oneOf:
            - type: string
              format: date-time
            - type: number
          description: ISO 8601 string or Unix timestamp in seconds. Defaults to the existing event end when omitted.

    UpdateResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          example: updated

    DeleteResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          example: deleted

paths:
  /events:
    get:
      summary: Get all events
      tags:
        - reference
      operationId: listEvents
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 10
            example: 20
          description: Maximum number of events to return.
        - name: cameras
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            example:
              - camera.front_door
              - camera.driveway
          style: form
          explode: false
          description: Comma-separated list of camera entity_ids.
        - name: categories
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            example:
              - person
              - package
          style: form
          explode: false
          description: Comma-separated list of categories.
        - name: labels
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            example:
              - squirrel
              - ladder
          style: form
          explode: false
          description: Comma-separated list of labels. An event matches when any of its labels is listed (case-insensitive).
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
            example: 2025-10-24T00:00:00+02:00
          description: Inclusive start of the time window as an ISO 8601 datetime. When provided, legacy days/hours windowing is ignored.
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
            example: 2025-10-24T23:59:59+02:00
          description: Inclusive end of the time window as an ISO 8601 datetime. When provided, legacy days/hours windowing is ignored.
        - name: days
          in: query
          required: false
          schema:
            type: integer
            example: 2
          description: Legacy time window [now - days, now]. Only applied when neither start nor end is provided.
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            example: 12
          description: Legacy time window [now - hours, now]. Only applied when days is also provided and neither start nor end is provided; takes precedence over days.
        - name: include_no_activity
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include events whose title contains "no activity".
      x-codeSamples:
        - lang: curl
          label: Example request
          source: |
            curl -H "Authorization: Bearer $TOKEN" \
              "https://homeassistant.local:8123/api/llmvision/timeline/events?limit=20&cameras=camera.front_door,camera.driveway&categories=person,package&start=2025-10-24T00:00:00%2B02:00&end=2025-10-24T23:59:59%2B02:00&include_no_activity=false"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Invalid start or end datetime
        '404':
          description: Settings config entry not found

  /event/{event_id}:
    get:
      summary: Get a single event
      tags:
        - reference
      operationId: getEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Event not found or settings config entry not found

    post:
      summary: Update an existing event
      tags:
        - reference
      operationId: updateEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EventResponse'
                  - $ref: '#/components/schemas/UpdateResponse'
        '400':
          description: Invalid JSON body, invalid start/end time or unknown category
        '404':
          description: Event not found or settings config entry not found
        '500':
          description: Error retrieving or updating event

    delete:
      summary: Delete an event
      tags:
        - reference
      operationId: deleteEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          description: Settings config entry not found
        '500':
          description: Error deleting event

  /events/new:
    post:
      summary: Create a new event
      tags:
        - reference
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '200':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid JSON body or unknown category
        '404':
          description: Settings config entry not found
        '500':
          description: Error creating event
